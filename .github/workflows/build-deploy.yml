name: Build, Deploy & Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Add-in
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate
      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  installer:
    name: Build Installer EXE
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download built dist
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: dist
      - name: Compile Inno Setup installer
        uses: minnyww/innosetup-compiler@v1
        with:
          script: installer/setup.iss
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OutlookSnooze-Setup
          path: installer/Output/OutlookSnooze-Setup-*.exe
          retention-days: 90
